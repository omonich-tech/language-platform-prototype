<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тестовый прототип платформы для учителей языков</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mut:#6b6a65;--line:#dedcd4;--acc:#2a6fdb;--accbg:#e7effc;--ok:#1f7a45;--okbg:#e4f3ea;--warn:#a65b00;--warnbg:#fdf0dc;--bad:#b3261e;--badbg:#fbe7e5}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--card:#211f1d;--ink:#eeece6;--mut:#a19f97;--line:#3a3834;--acc:#7aa7f5;--accbg:#1f2b43;--ok:#6fcf97;--okbg:#18301f;--warn:#e8b25c;--warnbg:#3a2d14;--bad:#f2928b;--badbg:#3d1d1b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:880px;margin:0 auto;padding:12px 14px 60px}
.banner{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.roles{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.roles button,.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;cursor:pointer}
.roles button.on,.tabs button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
.tabs{display:flex;gap:6px;margin:4px 0 14px;flex-wrap:wrap}
h1{font-size:21px;margin:4px 0 10px}h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}
.btn{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
.btn.sec{background:transparent;color:var(--acc)}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
input[type=checkbox],input[type=radio]{width:auto}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
textarea{min-height:60px;resize:vertical}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;background:var(--accbg);color:var(--acc)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.slot{border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:500;font-size:12px}
.note{background:var(--accbg);border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
.mark{display:flex;gap:8px;align-items:center;padding:4px 0}
details summary{cursor:pointer;color:var(--acc);font-size:13px}
.empty{color:var(--mut);padding:8px 0}
a{color:var(--acc)}
.vdock{position:fixed;right:12px;bottom:12px;z-index:50;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);width:400px;max-width:calc(100vw - 16px);overflow:hidden}
.vdock.big{width:min(900px,96vw)}
.vdock .vbar{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 8px;border-bottom:1px solid var(--line);font-size:13px}
.vdock .vbar span{display:flex;gap:4px;flex-wrap:wrap}
.vvid{position:relative;background:#111;height:280px}
.vdock.big .vvid{height:min(66vh,540px)}
#vremote{width:100%;height:100%;object-fit:contain;background:#111}
#vlocal{position:absolute;right:8px;bottom:8px;width:30%;max-width:150px;aspect-ratio:4/3;border-radius:8px;border:2px solid #fff;background:#000;object-fit:cover}
.vdock.min .vvid{display:none}.vdock .vtitle{cursor:move;user-select:none;touch-action:none}
.vstat{padding:6px 10px;font-size:13px;color:var(--mut)}
@media(max-width:700px){.vdock,.vdock.big{left:8px;right:8px;width:auto;bottom:8px}.vvid{height:240px}}
.board canvas{display:block;width:100%;aspect-ratio:5/3;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none;cursor:crosshair}
.btool{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.btn.sec.act{background:var(--accbg);font-weight:600}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw.act{box-shadow:0 0 0 2px var(--acc)}
</style>
</head>
<body>
<div id="app"></div>
<div id="vdock" class="vdock" hidden></div>

var KEY='lang-platform-test-v1';
var S;

function fresh(){
  return {
    role:'client',cv:{screen:'landing'},tv:{tab:'students',studentId:null},av:{tab:'verify'},
    room:null,fin:false,clientId:null,
    settings:{commission:12,trialPay:0,rate:12000},
    teachers:{maria:{id:'maria',name:'Мария',video:'https://meet.google.com/test-mariya',card:'Humo ••1234',paidOut:0,payoutReq:false,
      langs:[
        {lang:'Английский',price:15,status:'verified',reason:''},
        {lang:'Русский',price:12,status:'verified',reason:''},
        {lang:'Узбекский',price:10,status:'verified',reason:''},
        {lang:'Немецкий',price:15,status:'pending',reason:''},
        {lang:'Испанский',price:18,status:'pending',reason:''},
        {lang:'Корейский',price:18,status:'pending',reason:''}
      ],
      avail:{0:[10,18],1:[10,18],2:[10,18],3:[10,18],4:[10,16]}}},
    students:[],lessons:[],payments:[],disputes:[],requests:[],invites:[],log:[],msgs:[],nid:1
  };
}
function load(){try{var j=localStorage.getItem(KEY);if(j)return JSON.parse(j);}catch(e){}return fresh();}

/* ---------- общая база (сервер) ---------- */
var SHARED=['settings','teachers','students','lessons','payments','disputes','requests','invites','log','msgs','nid'];
var DOC=null,DBREF=null,MYID=Math.random().toString(36).slice(2),canWrite=true,syncState='local';
var pushing=false,dirty=false,lastStr='',pendingRender=false,slowTimer=null;
function sharedOf(){var o={};SHARED.forEach(function(k){o[k]=S[k];});return o;}
function clone(x){return JSON.parse(JSON.stringify(x));}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  push();
}
function push(){
  if(!DOC||!canWrite)return;
  var str=JSON.stringify(sharedOf());
  if(str===lastStr)return;
  if(pushing){dirty=true;return;}
  pushing=true;dirty=false;lastStr=str;
  DOC.set({data:clone(sharedOf()),by:MYID,t:Date.now()}).then(function(){
    pushing=false;if(dirty)push();
  },function(e){
    pushing=false;
    if(e&&e.code==='invalid_argument'){canWrite=false;setSync('readonly');trackErr('Нет прав записи в общую базу','sync');}
    else{lastStr='';setSync('error');trackErr('Не удалось сохранить в общую базу','sync');}
  });
}
function setSync(s){syncState=s;var b=document.querySelector('.banner .syncmsg');if(b)b.textContent=syncText();}
function syncText(){
  return {local:'Данные только в этом браузере.',online:'Общая база подключена: изменения видны всем, кто открыл страницу.',slow:'Связь с общей базой медленная, данные могут быть устаревшими.',readonly:'Режим просмотра: ваши изменения не сохраняются в общей базе.',error:'Общая база недоступна, данные только в этом браузере.'}[syncState];
}
function connect(){
  if(typeof claude==='undefined'||!claude||!claude.use)return;
  claude.use('db').then(function(db){
    if(!db)return;
    return Promise.resolve(claude.use('user')).then(function(u){
      if(u&&u.can){return Promise.resolve(u.can('data.write')).then(function(r){if(r===false)canWrite=false;},function(){});}
    }).then(function(){
      DOC=db.doc('app/state');DBREF=db;
      ST={};ST[MYID]=ME;statDirty=true;scheduleStatPush();
      if(S.role==='admin'&&S.av.tab==='analytics')ensureStatSub();
      slowTimer=setTimeout(function(){setSync('slow');},10000);
      DOC.onSnapshot(function(snap){
        if(!snap.metadata.fromCache){clearTimeout(slowTimer);}
        if(!snap.exists){
          if(!snap.metadata.fromCache){setSync(canWrite?'online':'readonly');push();}
          return;
        }
        var d=snap.data();
        setSync(canWrite?'online':'readonly');
        if(d.by===MYID)return;
        SHARED.forEach(function(k){if(d.data&&d.data[k]!==undefined)S[k]=clone(d.data[k]);});
        lastStr=JSON.stringify(sharedOf());
        var ae=document.activeElement;
        if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT')){pendingRender=true;}
        else render();
      },function(){setSync('error');});
    });
  }).catch(function(){setSync('error');});
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(s){return document.querySelector(s);}
function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function nid(){return S.nid++;}
function p2(n){return String(n).padStart(2,'0');}
function T(){return S.teachers.maria;}
function stu(i){return S.students.find(function(s){return s.id===i;});}
function les(i){return S.lessons.find(function(l){return l.id===i;});}
function usd(n){return '$'+(Math.round(n*100)/100);}
function som(n){return Math.round(n*S.settings.rate).toLocaleString('ru-RU')+' сум';}
function priceOf(t,lang){var x=t.langs.find(function(l){return l.lang===lang;});return x?x.price:0;}
function say(to,text){S.msgs.unshift({to:to,text:text,t:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})});}
function slotLabel(s){var a=s.split(' '),d=a[0].split('-').map(Number),dt=new Date(d[0],d[1]-1,d[2]);return DAYS[(dt.getDay()+6)%7]+' '+p2(d[2])+'.'+p2(d[1])+' · '+p2(Number(a[1]))+':00';}
function taken(tid,slot){return S.lessons.some(function(l){return l.teacherId===tid&&l.slot===slot&&l.status==='planned';});}
function genSlots(tid){
  var t=S.teachers[tid],out=[],now=new Date();
  for(var i=1;i<=7;i++){
    var dt=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i),wd=(dt.getDay()+6)%7,a=t.avail[wd];
    if(!a)continue;
    for(var h=a[0];h<a[1];h++){
      var s=dt.getFullYear()+'-'+p2(dt.getMonth()+1)+'-'+p2(dt.getDate())+' '+p2(h);
      if(!taken(tid,s))out.push(s);
    }
  }
  return out;
}
function leftOf(s){return s.credits+S.lessons.filter(function(l){return l.studentId===s.id&&l.type==='regular'&&l.status==='planned';}).length;}
function earnedOf(t){return S.lessons.filter(function(l){return l.teacherId===t.id&&l.status==='done';}).reduce(function(a,l){return a+l.earned;},0);}
function balanceOf(t){return earnedOf(t)-t.paidOut;}
function verifiedLangs(t){return t.langs.filter(function(l){return l.status==='verified';});}
function statusChip(l){
  var m={verified:['ok','Проверен'],pending:['warn','На проверке'],test:['warn','Нужен проверочный урок'],rejected:['bad','Отказ']}[l.status];
  return '<span class="chip '+m[0]+'">'+m[1]+'</span>'+(l.status==='rejected'&&l.reason?' <span class="mut">'+esc(l.reason)+'</span>':'');
}
function statusLesson(l){
  var m={planned:['','Запланирован'],done:['ok','Проведён'],noshow:['warn','Ученик не пришёл'],returned:['bad','Урок возвращён после спора']}[l.status];
  return '<span class="chip '+m[0]+'">'+m[1]+'</span>';
}

  if(S.room&&les(S.room))return 'room:'+S.role;

    if(m.t==='put'&&m.it&&m.it.id)bPut(m.it);
    else if(m.t==='full'&&m.items){m.items.forEach(function(it){if(it&&it.id&&!B.items.some(function(x){return x.id===it.id;}))B.items.push(it);});if(!dc._got){dc._got=true;hello();}}
    else if(m.t==='clr')B.items=[];
    else if(m.t==='undo')B.items=B.items.filter(function(x){return x.id!==m.id;});
    bSave();bDraw();
  });
  dc.on('close',function(){if(B.dc===dc)B.dc=null;});
}

var A={
  role:function(d){S.role=d.k;S.room=null;S.fin=false;},

  cGo:function(d){S.cv={screen:d.s};},
  cBookStart:function(){S.cv={screen:'book',lang:val('c-lang')};},
  cBook:function(){

    S.lessons.push({id:nid(),studentId:s.id,teacherId:'maria',slot:r.value,type:'trial',status:'planned',priv:'',shared:'',homework:'',marks:[],summary:'',price:0,earned:0});
    say(name+' ('+contact+')','Вы записаны на пробный урок: '+slotLabel(r.value)+'. Вход в кабинет по этой ссылке, регистрация не нужна.');
    say('Мария','Новая запись на пробный урок: '+name+', '+S.cv.lang+', '+slotLabel(r.value)+'.');
    S.cv={screen:'cab'};
  },
  cRequest:function(){
    var n=val('r-name'),c=val('r-contact');
    if(!n||!c){alert2('Заполните имя и контакт.');return false;}
    S.requests.push({id:nid(),name:n,contact:c,lang:val('r-lang'),goal:val('r-goal')||'не указана',done:false});
    say('Администратор','Новая заявка клиента: '+n+', '+val('r-lang')+'.');
    S.cv={screen:'requestDone'};
  },
  cLogin:function(d){S.clientId=Number(d.id);S.cv={screen:'cab'};},
  cPack:function(d){S.cv={screen:'pay',n:Number(d.n)};},
  cPay:function(){
    var s=stu(S.clientId),n=S.cv.n,price=priceOf(S.teachers[s.teacherId],s.lang),m=document.querySelector('input[name=p-m]:checked');
    S.payments.push({id:nid(),studentId:s.id,amount:price*n,method:m?m.value:'Visa'});
    s.credits+=n;s.paidAny=true;
    say(s.name,'Оплата получена: пакет '+n+' уроков, '+usd(price*n)+'. Выберите время уроков.');
    say('Мария','Ученик '+s.name+' оплатил пакет '+n+' уроков.');
    S.cv={screen:'schedule'};
  },
  cSchedule:function(){
    var s=stu(S.clientId),ch=Array.prototype.slice.call(document.querySelectorAll('input[name=sl]:checked'));
    if(!ch.length){alert2('Отметьте хотя бы один слот или нажмите «Выберу позже».');return false;}
    if(ch.length>s.credits){alert2('Можно выбрать не больше '+s.credits+'.');return false;}
    ch.forEach(function(c){S.lessons.push({id:nid(),studentId:s.id,teacherId:s.teacherId,slot:c.value,type:'regular',status:'planned',priv:'',shared:'',homework:'',marks:[],summary:'',price:0,earned:0});});
    s.credits-=ch.length;
    say(s.name,'Время уроков сохранено: '+ch.length+'. Напомним за день до каждого.');
    S.cv={screen:'cab'};
  },
  cDispute:function(d){
    var t=val('dr-'+d.id);if(!t){alert2('Опишите, что пошло не так.');return false;}
    S.disputes.push({id:nid(),lessonId:Number(d.id),text:t,status:'open',opened:false});
    say('Администратор','Новая жалоба на урок.');
  },
  openRoom:function(d){S.room=Number(d.id);S.fin=false;var l=les(S.room);if(l&&!l.vcode)l.vcode=vNewCode();},
  closeRoom:function(){S.room=null;S.fin=false;},
  vStart:function(d){
    var l=les(S.room);if(!l)return false;
    var code=(val('v-code')||l.vcode||vNewCode()).toLowerCase().replace(/[^a-z0-9]/g,'');
    if(code.length<4)return false;
    l.vcode=code;vCleanup();
    VID={on:true,room:l.id,big:false,key:code+'-'+Date.now(),code:code,mic:true,cam:true,share:false,status:'',peer:null,local:null,screen:null,call:null,host:false,timer:null,hasCam:true};

  },
  bTool:function(d){B.tool=d.k;},
  bColor:function(d){B.color=d.k;if(B.tool==='eraser')B.tool='pen';},
  bUndo:function(){for(var i=B.items.length-1;i>=0;i--){if(B.mine[B.items[i].id]){var id=B.items[i].id;B.items.splice(i,1);bSend({t:'undo',id:id});bSave();return;}}return false;},

  vSize:function(){VID.big=!VID.big;if(VID.big)VID.min=false;},

  vMic:function(){if(!VID.local)return false;VID.mic=!VID.mic;VID.local.getAudioTracks().forEach(function(x){x.enabled=VID.mic;});},
  vCam:function(){if(!VID.local||!VID.local.getVideoTracks().length)return false;VID.cam=!VID.cam;VID.local.getVideoTracks().forEach(function(x){x.enabled=VID.cam;});},

  },
  noShow:function(d){var l=les(Number(d.id));l.status='noshow';S.room=null;say('Администратор','Ученик не пришёл на урок. Правило ожидания и возврата ещё не решено.');},
  aTab:function(d){S.av.tab=d.k;if(d.k==='analytics')ensureStatSub();},
  statClear:function(){
    var keep=ME;
    ST={};ST[MYID]=ME=newMe();
    try{localStorage.removeItem(STKEY);}catch(e){}
    if(DBREF&&canWrite){
      DBREF.collection('stats').get().then(function(snap){
        return Promise.all(snap.docs.map(function(d){return d.id===MYID?null:DBREF.doc('stats/'+d.id).delete();}));
      }).then(function(){statDirty=true;scheduleStatPush();},function(){});
    }
  },
  aVerify:function(d){
    var l=T().langs[Number(d.i)];l.status=d.st;
    say('Мария',d.st==='verified'?'Язык «'+l.lang+'» подтверждён, значок «Проверен» появился на странице.':'По языку «'+l.lang+'» нужен проверочный урок.');
  },
  aReject:function(d){
    var l=T().langs[Number(d.i)],r=val('rj-'+d.i);
    if(!r){alert2('Укажите причину отказа.');return false;}
    l.status='rejected';l.reason=r;say('Мария','По языку «'+l.lang+'» отказ: '+r);
  },
  aInvite:function(){var c=val('inv-ch');if(!c)return false;S.invites.push(c);},
  aMatch:function(d){
    var r=S.requests.find(function(x){return x.id===Number(d.id);}),slots=genSlots('maria');
    var s={id:nid(),name:r.name,contact:r.contact,teacherId:'maria',lang:r.lang,source:'platform',credits:0,board:'',paidAny:false};
    S.students.push(s);
    if(slots.length)S.lessons.push({id:nid(),studentId:s.id,teacherId:'maria',slot:slots[0],type:'trial',status:'planned',priv:'',shared:'',homework:'',marks:[],summary:'',price:0,earned:0});
    r.done=true;
    say(r.name+' ('+r.contact+')','Мы подобрали вам учителя: Мария. Пробный урок: '+(slots.length?slotLabel(slots[0]):'время уточним')+'.');
    say('Мария','Администратор подобрал вам клиента: '+r.name+', '+r.lang+'. С его уроков удерживается комиссия '+S.settings.commission+'%.');
  },
  aPay:function(){var t=T(),b=balanceOf(t);t.paidOut+=b;t.payoutReq=false;say('Мария','Выплата отправлена: '+usd(b)+' ('+som(b)+') на '+t.card+'.');},
  aOpenDispute:function(d){
    var x=S.disputes.find(function(q){return q.id===Number(d.id);});x.opened=true;
    S.log.unshift(new Date().toLocaleString('ru-RU')+' · Фаррух открыл материалы урока по жалобе №'+x.id+' (причина: спор)');
  },
  aResolve:function(d){
    var x=S.disputes.find(function(q){return q.id===Number(d.id);}),l=les(x.lessonId),s=stu(l.studentId);
    x.status=d.r;
    if(d.r==='returned'){l.status='returned';l.earned=0;if(l.type==='regular')s.credits+=1;say(s.name,'Спор решён в вашу пользу: урок возвращён в пакет.');say('Мария','По жалобе урок возвращён ученику, заработок за него отменён.');}
    else say(s.name,'Жалоба отклонена администратором.');
  },
  aSettings:function(){S.settings.commission=Number(val('s-com'))||0;S.settings.trialPay=Number(val('s-trial'))||0;S.settings.rate=Number(val('s-rate'))||1;}
};
function alert2(t){
  trackErr(t,'validation');
  var b=document.querySelector('.banner');
  if(b){b.innerHTML='<span><b>'+esc(t)+'</b></span>';}
}
window.addEventListener('error',function(e){try{trackErr(e.message||'Ошибка кода','js');}catch(x){}});
window.addEventListener('unhandledrejection',function(e){try{trackErr((e.reason&&e.reason.message)||'Необработанная ошибка','js');}catch(x){}});
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');
  if(!t){if(!(e.target.closest&&e.target.closest('#bcv')))trackMiss(e.target);return;}
  var f=A[t.dataset.a];
  if(!f)return;
  trackClick(t.dataset);
  errFlag=false;
  var r=f(t.dataset,t);
  if(r===false){if(!errFlag)trackErr('Действие не выполнено: поле пустое','validation');return;}
  render();
  if(['role','cGo','cBookStart','cBook','cRequest','cPack','cPay','cSchedule','openRoom','closeRoom','tTab','tStudent','aTab','finDone','noShow','reset'].indexOf(t.dataset.a)>=0)window.scrollTo(0,0);
});
S=load();
try{ST=JSON.parse(localStorage.getItem(STKEY)||'{}')||{};}catch(e){ST={};}
ensureMe();
render();
connect();
</script>
</body>
</html>
